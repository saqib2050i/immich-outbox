name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanity-check the app
        run: python -m compileall -q app

      # A broken relay is expensive to notice: it fails by going quiet, and
      # the cost of a bad ledger is a duplicate of your library in Google
      # Photos. Nothing gets published without the suite passing.
      - name: Test
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never publish, so a fork cannot push an image.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version a person can compare at a glance. Without this the image
      # reported its branch name ("main") and a commit hash, which answers
      # "which commit" but not "am I on the latest?".
      #
      # A release tag wins when there is one; otherwise the workflow run
      # number, which only ever goes up.
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 included so this also runs on a Pi or an ARM NAS.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # So the dashboard can show which image is running.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.name }}
            APP_REVISION=${{ github.sha }}
            APP_BUILT_AT=${{ steps.version.outputs.built_at }}
