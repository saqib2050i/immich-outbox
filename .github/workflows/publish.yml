name: Build and publish image

# Actions are pinned to a commit, with the version in the comment beside it.
# A tag like @v4 is a moving pointer that the action's owner can repoint at
# any time, and this workflow holds the app signing keystore and a token
# that can push to the registry -- so "whatever v4 means today" is a larger
# risk than any of the deprecation notices these runs print. Dependabot
# keeps the pins current; see .github/dependabot.yml.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The phone app, built first so the image can carry it and the Pixel can
  # update itself from the server rather than from a cable.
  #
  # Deliberately not allowed to block a server release: if the Android
  # toolchain breaks, the relay should still ship. The image then reports
  # that no app is bundled, which the install page says out loud.
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # Android installs an update only over the same signing key. The debug
      # keystore is generated per machine, so without a stable key from here
      # every build would be a different app to the phone and updates would
      # be refused. Absent the secret we still build -- a debug APK installs
      # fine first time -- and label it so the install page can warn.
      - id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/companion.jks"
            # Strip whitespace first: a value pasted into the secrets form can
            # pick up line breaks, and `base64 -d` answers that with
            # "invalid input" and nothing else to go on.
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KS" 2>/dev/null || true

            if [ ! -s "$KS" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to anything. \
                Re-run 'base64 -i your.jks | pbcopy' and paste it again, whole."
              exit 1
            fi
            # A truncated paste can still decode. A keystore starts with a DER
            # SEQUENCE (PKCS12, 0x30) or JKS's 0xFEEDFEED; anything else means
            # the value arrived incomplete.
            MAGIC=$(head -c 4 "$KS" | od -An -tx1 | tr -d ' \n')
            case "$MAGIC" in
              30*|feedfeed) ;;
              *) echo "::error::ANDROID_KEYSTORE_BASE64 decoded to $(stat -c%s "$KS") \
                   bytes that are not a keystore (starts $MAGIC). The paste was \
                   probably truncated — copy the whole value and try again."
                 exit 1 ;;
            esac

            # Fail here, with a sentence, rather than inside Gradle.
            if ! keytool -list -keystore "$KS" \
                   -storepass:env ANDROID_KEYSTORE_PASSWORD \
                   -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              # A truncated paste still begins 0x30, so it reaches here rather
              # than the magic check. All three causes get named because the
              # size is the only clue that separates them.
              echo "::error::Could not open the keystore ($(stat -c%s "$KS") bytes \
                decoded). Either ANDROID_KEYSTORE_PASSWORD is wrong, \
                ANDROID_KEY_ALIAS ('$ANDROID_KEY_ALIAS') is not in it, or the \
                pasted value was truncated — compare that byte count with the \
                size of your .jks file."
              exit 1
            fi
            echo "Keystore accepted: $(stat -c%s "$KS") bytes, alias $ANDROID_KEY_ALIAS"
            echo "path=$KS" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a \
              debug-signed app. Installing it over a differently signed copy \
              will need the old one removed first."
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app
        working-directory: companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.kind }}" = "release" ]; then
            ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/companion.apk"
          else
            ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/companion.apk"
          fi

      - name: Describe the build
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/companion.apk" dist/companion.apk
          python3 - <<'PY' > dist/companion.json
          import hashlib, json, os, datetime
          blob = open("dist/companion.apk", "rb").read()
          print(json.dumps({
              "version": open("VERSION").read().strip(),
              "sha256": hashlib.sha256(blob).hexdigest(),
              "size": len(blob),
              "signed": os.environ["KIND"],
              "built_at": datetime.datetime.now(datetime.timezone.utc)
                          .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2))
          PY
        env:
          KIND: ${{ steps.sign.outputs.kind }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-apk
          path: dist/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: companion
    # `needs` alone would skip this if the app build failed. The relay ships
    # either way -- but the companion job is left able to fail, so the run
    # goes red and somebody looks, rather than the app quietly going stale.
    if: always()
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lands in dist/, which the Dockerfile copies. Missing is fine: the
      # server reports that no app is bundled.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: companion-apk
          path: dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Sanity-check the app
        run: python -m compileall -q app

      # A broken relay is expensive to notice: it fails by going quiet, and
      # the cost of a bad ledger is a duplicate of your library in Google
      # Photos. Nothing gets published without the suite passing.
      - name: Test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
          pip install -q -r requirements-dev.txt
          python -m pytest -q

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Pull requests build but never publish, so a fork cannot push an image.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version a person can compare at a glance. Without this the image
      # reported its branch name ("main") and a commit hash, which answers
      # "which commit" but not "am I on the latest?".
      #
      # The VERSION file is the only place the number is edited. A tag does
      # not override it -- it has to agree with it, or the build fails.
      # A tag that disagrees would publish two different images claiming the
      # same version, which is worse than a red build.
      - id: version
        run: |
          version="$(tr -d ' \t\n\r' < VERSION)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION is '$version', expected x.y.z"; exit 1 ;;
          esac

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag ${tag} does not match VERSION ${version}"
              exit 1
            fi
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # arm64 included so this also runs on a Pi or an ARM NAS.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # So the dashboard can show which image is running.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.name }}
            APP_REVISION=${{ github.sha }}
            APP_BUILT_AT=${{ steps.version.outputs.built_at }}
