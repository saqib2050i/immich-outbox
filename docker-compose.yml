# Deployment compose. Pulls the published image -- no source checkout needed
# on the server. Paste this straight into Dockge or Portainer.
#
# Replace YOUR-GITHUB-USERNAME below.

services:
  immich-outbox:
    image: ghcr.io/YOUR-GITHUB-USERNAME/immich-outbox:latest
    container_name: immich-outbox
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - /mnt/user/appdata/immich-outbox:/data
      # The folder Syncthing shares with the Pixel.
      - /mnt/user/photo-outbox:/outbox
      # Downloads land here first, then move into the outbox. Keep it on the
      # same filesystem as the outbox so the move is atomic -- a half-written
      # file inside the outbox would be synced and uploaded as-is.
      - /mnt/user/photo-outbox-spool:/spool
    environment:
      # First-run defaults only. After that, edit everything on the dashboard
      # at http://<server>:8099 -- settings live in the database and apply
      # without a restart.
      IMMICH_URL: "http://192.168.1.10:2283"
      IMMICH_API_KEY: "CHANGE-ME"
      OUTBOX_MAX_GB: "10"
      MIN_TAKEN_AT: "1970-01-01"
      INCLUDE_VIDEO: "true"
      MAX_ASSET_MB: "4096"
      FEED_INTERVAL_MIN: "10"
      SCAN_INTERVAL_MIN: "15"
      FULL_SCAN_INTERVAL_HOURS: "6"
      STUCK_AFTER_DAYS: "45"
